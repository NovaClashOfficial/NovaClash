<main class="contenedor">

<h1>🏆 PICK'EM</h1>

<p class="descripcion">
Elige al ganador de cada partido de Octavos de Final y predice si ganará 2-0 o 2-1.
</p>

  <section id="bonus-nova" class="bonus-nova">

    <div class="bonus-icono">
        🎁
    </div>

    <div class="bonus-contenido">
        <h2>BONUS NOVA CLASH</h2>

        <p>
            Como uno de los partidos de Octavos se jugará después
            del inicio de Cuartos, podés reclamar una recompensa.
        </p>

        <strong class="bonus-puntos">
            +3 PUNTOS
        </strong>

        <button id="btn-reclamar-bonus" type="button">
            🎁 RECLAMAR BONUS
        </button>

        <p id="mensaje-bonus"></p>
    </div>

</section>

<div id="partidos"></div>

<input
type="text"
id="nombre"
placeholder="Escribe tu nombre"
autocomplete="off"
maxlength="30">

<button id="btn-enviar" type="button" onclick="enviarPredicciones()">
ENVIAR PREDICCIONES
</button>

<p id="mensaje-prediccion"></p>
