<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pick'Em | Nova Clash II</title>

  <link rel="stylesheet" href="style-v2.css?v=5">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>

<div class="fondo-v2"></div>

<!-- NAVBAR -->

<nav class="navbar-v2">

  <div class="nav-logo-v2">
    NOVA CLASH <span>II</span>
  </div>

  <div class="nav-links-v2">
    <a href="index-v2.html">Inicio</a>
    <a href="predicciones-v2.html" class="activo">Pick'Em</a>
    <a href="ranking-v2.html">Ranking</a>
    <a href="reglas-v2.html">Reglas</a>
  </div>

</nav>

<!-- CONTENIDO -->

<main class="pickem-v2">

  <section class="pickem-header">

    <p class="temporada">
      NOVA CLASH · 2.ª EDICIÓN
    </p>

    <h1>🏆 PICK'EM</h1>

    <p>
      Predice cada enfrentamiento del torneo,
      suma puntos y conviértete en el campeón del Pick'Em.
    </p>

  </section>

  <!-- ESTADO -->

  <section class="estado-pickem-v2">

    <span class="estado-punto"></span>

    <div>
      <strong id="estado-pickem-texto">
        CARGANDO...
      </strong>
      <p id="titulo-fase-v2">
        FASE DE GRUPOS
      </p>
    </div>

  </section>

  <!-- PARTIDOS -->

  <section class="fase-pickem-v2">

    <div id="partidos-v2">

      <!-- Los partidos aparecerán automáticamente -->

    </div>

  </section>

  <!-- ENVIAR -->

  <section class="envio-pickem-v2">

    <h2>ENVIAR PREDICCIONES</h2>

    <input
      id="nombre-v2"
      type="text"
      placeholder="Escribe tu nombre o Nick"
      maxlength="30"
      autocomplete="off"
    >

    <button
      id="btn-enviar-v2"
      class="btn-principal"
      type="button"
      onclick="enviarPrediccionesV2()"
    >
      ENVIAR PREDICCIONES
    </button>

  </section>

</main>

<footer class="footer-v2">

  <p>NOVA CLASH II</p>

  <span>COMPITE · PREDICE · CONQUISTA</span>

</footer>

<!-- IMPORTANTE -->
<script type="module" src="predicciones-v2.js?v=1"></script>

</body>
</html>
