<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nova Clash | Panel Admin</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet"
  >
</head>

<body>

  <nav class="navbar">
    <div class="nav-logo">
      NOVA CLASH ADMIN
    </div>

    <div class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="ranking.html">Ranking</a>
    </div>
  </nav>

  <main class="contenedor">

    <img
      src="logo.png"
      class="logo"
      alt="Logo Nova Clash"
    >

    <h1>Panel de Administración</h1>

    <p class="descripcion">
      Controla el Pick'Em y carga los resultados oficiales de Octavos.
    </p>

    <hr>

    <section>

      <h2>Estado de las predicciones</h2>

      <label class="estado-predicciones">
        <input
          type="checkbox"
          id="estadoPredicciones"
        >

        Predicciones abiertas
      </label>

      <br>

      <button
        type="button"
        id="btn-estado"
        onclick="guardarEstado()"
      >
        GUARDAR ESTADO
      </button>

    </section>

    <hr>

    <section>

      <h2>Resultados de Octavos</h2>

      <p class="descripcion">
        Selecciona el ganador y el resultado real de cada partido.
        Puedes guardar partidos de forma parcial.
      </p>

      <div id="adminPartidos"></div>

      <button
        type="button"
        id="btn-resultados"
        onclick="guardarResultados()"
      >
        GUARDAR RESULTADOS
      </button>

      <p id="mensaje-panel"></p>

    </section>

  </main>

  <script type="module" src="panel.js"></script>

</body>

</html>
