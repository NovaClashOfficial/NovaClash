<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Nova Clash | En mantenimiento</title>

  <link
    rel="stylesheet"
    href="mantenimiento.css?v=1"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet"
  >
</head>

<body>

  <div class="fondo-grid"></div>

  <main class="mantenimiento">

    <section class="tarjeta">

      <div class="estado">
        ● SISTEMA EN ACTUALIZACIÓN
      </div>

      <div class="icono">
        🛠️
      </div>

      <p class="marca">
        NOVA CLASH
      </p>

      <h1>
        SITIO EN<br>
        MANTENIMIENTO
      </h1>

      <div class="linea"></div>

      <p class="descripcion">
        Estamos preparando una nueva experiencia.
      </p>

      <div class="season">

        <span>PRÓXIMAMENTE</span>

        <strong>
          NOVA CLASH
          <em>2.ª EDICIÓN</em>
        </strong>

      </div>

      <p class="mensaje">
        Nuevas funciones, nuevas batallas
        y una nueva temporada están en camino.
      </p>

      <div class="loader">

        <div class="loader-barra"></div>

      </div>

      <p class="estado-inferior">
        Preparando Nova Clash V2...
      </p>

    </section>

  </main>

</body>

</html>
